# Joseph S. Wirth, 2024
## provides a conda environment for running primerForge
## commands:
##        $ conda env create -f environment.yml
##        $ conda activate primerforge

name: primerforge
channels:
  - conda-forge
  - bioconda
dependencies:
  - biopython >=1.81
  - cython >=3.2
  - ispcr
  - numpy
  - pip >=23
  - primer3-py >=2.0
  - pyahocorasick >=2.1
  - python >=3.9
  - scipy >=1.10
  - setuptools
